name: EV3
description: 'Escape Velocity (EV3) is an early-stage crypto and web3 venture capital
  firm based in New York, co-founded by Mahesh Ramakrishnan and Salvador Gala, that
  backs founders building frontier-technology companies across programmable money,
  programmable molecules, and programmable intelligence. EV3 writes early-stage checks
  and concentrates on crypto-enabled and decentralized physical infrastructure (DePIN)
  businesses spanning advertising and attention, credit and liquidity, machine maps,
  and energy and bandwidth. Its funds have drawn backing from investors including
  Multicoin Capital. EV3 is an investment firm rather than a product company and publishes
  no public API or developer surface.'
